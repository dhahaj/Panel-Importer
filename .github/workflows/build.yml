name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]  # a version tag also publishes a GitHub release (job "release")
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ncompress
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the one-folder bundle
        run: pyinstaller packaging/panelimport.spec --noconfirm
      - name: Smoke-test the bundle without Python on PATH
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from tests.synthetic.odbgen import sr_panel; sr_panel(compress_members=True).write_tgz(Path('smoke.tgz'))"
          python -c "from pathlib import Path; from tests.synthetic.projects import make_project; from panelimport.model.project_file import save_project; p = make_project(); p.source.path = 'none.tgz'; save_project(p, Path('smoke.panel.json'))"
          Copy-Item smoke.tgz dist\PanelImporter\
          Copy-Item smoke.panel.json dist\PanelImporter\
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python' }) -join ';'
          Push-Location dist\PanelImporter
          .\panelimport.exe analyze smoke.tgz
          if ($LASTEXITCODE -ne 0) { throw "panelimport.exe analyze failed: $LASTEXITCODE" }
          .\panelimport.exe iss smoke.panel.json
          if ($LASTEXITCODE -ne 0) { throw "panelimport.exe iss failed: $LASTEXITCODE" }
          .\panelimport.exe iss-compare smoke.iss smoke.iss
          if ($LASTEXITCODE -ne 0) { throw "panelimport.exe iss-compare failed: $LASTEXITCODE" }
          $p = Start-Process -FilePath .\PanelImporter.exe -ArgumentList "--smoke-test", "smoke.tgz" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "PanelImporter.exe --smoke-test failed: $($p.ExitCode)" }
          Remove-Item smoke.tgz, smoke.panel.json, smoke.iss
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: PanelImporter-windows
          path: dist/PanelImporter

  linux:
    # The oldest supported runner: the bundle needs a glibc at least as new as the build's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Build the one-folder bundle
        run: pyinstaller packaging/panelimport.spec --noconfirm
      - name: Smoke-test the bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from pathlib import Path; from tests.synthetic.odbgen import sr_panel; sr_panel(compress_members=True).write_tgz(Path('smoke.tgz'))"
          python -c "from pathlib import Path; from tests.synthetic.projects import make_project; from panelimport.model.project_file import save_project; p = make_project(); p.source.path = 'none.tgz'; save_project(p, Path('smoke.panel.json'))"
          cp smoke.tgz smoke.panel.json dist/PanelImporter/
          unset LD_LIBRARY_PATH  # setup-python's libpython must not stand in for the bundle's
          cd dist/PanelImporter
          ./panelimport analyze smoke.tgz
          ./panelimport iss smoke.panel.json
          ./panelimport iss-compare smoke.iss smoke.iss
          ./PanelImporter --smoke-test smoke.tgz
          rm smoke.tgz smoke.panel.json smoke.iss
      - name: Pack the bundle
        # A tarball keeps the executable bits, which an artifact upload drops.
        run: tar -czf PanelImporter-linux-x64.tar.gz -C dist PanelImporter
      - uses: actions/upload-artifact@v4
        with:
          name: PanelImporter-linux
          path: PanelImporter-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the package version
        run: |
          version=$(python3 -c "import panelimport; print(panelimport.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match panelimport.__version__ $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # checkout leaves a lightweight tag; fetch the annotated one for its release notes.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package the builds
        run: |
          mv artifacts/PanelImporter-windows PanelImporter
          zip -qr "PanelImporter-$VERSION-windows-x64.zip" PanelImporter
          mv artifacts/PanelImporter-linux/PanelImporter-linux-x64.tar.gz "PanelImporter-$VERSION-linux-x64.tar.gz"
          sha256sum PanelImporter-$VERSION-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag \
            --title "Panel Importer $VERSION" \
            "PanelImporter-$VERSION-windows-x64.zip" "PanelImporter-$VERSION-linux-x64.tar.gz" SHA256SUMS.txt
